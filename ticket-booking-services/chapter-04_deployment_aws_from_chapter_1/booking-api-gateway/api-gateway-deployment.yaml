apiVersion: apps/v1
kind: Deployment

metadata:
  name: api-gateway-deployment
  labels:
    app: api-gateway-app
    version: v1

spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway-app
      version: v1

  template:
    metadata:
      labels:
        app: api-gateway-app
        version: v1

    spec:
      containers:
        - name: api-gateway-container
          image: 
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10              
          envFrom:
            - configMapRef:
                name: api-gateway-config
---

apiVersion: v1
kind: Service

metadata:
  name: api-gateway-service
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing

spec:
  type: LoadBalancer
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: api-gateway-app
    version: v1

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
data:
  BOOKING_SERVICE_URL: "http://booking-service:8080"
  INVENTORY_SERVICE_URL: "http://inventory-service:8080"
  USER_SERVICE_URL: "http://user-management-service:8080"
  PAYMENT_SERVICE_URL: "http://payment-service:8080"
