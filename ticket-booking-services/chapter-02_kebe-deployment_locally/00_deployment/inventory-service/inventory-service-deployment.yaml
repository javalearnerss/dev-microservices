apiVersion: apps/v1
kind: Deployment

metadata:
  name: inventory-service-deployment
  labels:
    app: inventory-service-app
    version: v1

spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service-app
      version: v1

  template:
    metadata:
      labels:
        app: inventory-service-app
        version: v1

    spec:
      containers:
        - name: inventory-service-container
          image: inventory-service:v1.100
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8054
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8054
            initialDelaySeconds: 60
            periodSeconds: 10              

---

apiVersion: v1
kind: Service

metadata:
  name: inventory-service


spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8054
  selector:
    app: inventory-service-app
    version: v1